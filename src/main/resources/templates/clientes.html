<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments :: menu('clientes')}"></div>
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold mb-0">Gestión de Afiliados (RF001)</h3>
                <button class="btn btn-danger fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoCliente">
                    <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
                </button>
            </div>

            <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form class="row g-2 mb-3" method="get" th:action="@{/clientes}">
                <div class="col-md-4">
                    <input type="text" name="buscar" class="form-control" placeholder="Buscar por nombre o cédula..." th:value="${buscar}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark"><i class="bi bi-search"></i> Buscar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>

            <div class="card card-kpi p-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr><th>Cédula</th><th>Nombre Completo</th><th>Edad</th><th>Teléfono</th><th>Membresía</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td class="fw-bold" th:text="${c.cedula}"></td>
                                <td th:text="${c.nombreCompleto}"></td>
                                <td th:text="${c.edad}"></td>
                                <td th:text="${c.telefono}"></td>
                                <td th:text="${c.tipoMembresia}"></td>
                                <td th:text="${c.fechaVencimiento}"></td>
                                <td>
                                    <span th:if="${c.estadoMembresia == 'ACTIVA'}" class="badge bg-success">ACTIVA</span>
                                    <span th:unless="${c.estadoMembresia == 'ACTIVA'}" class="badge bg-danger">VENCIDA</span>
                                </td>
                                <td>
                                    <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Dar de baja a este cliente?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Nuevo Cliente -->
<div class="modal fade" id="modalNuevoCliente" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/clientes/guardar}" method="post">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Registrar Nuevo Afiliado</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2"><label class="form-label">Cédula</label><input type="text" name="cedula" class="form-control" required></div>
                <div class="mb-2"><label class="form-label">Nombre Completo</label><input type="text" name="nombreCompleto" class="form-control" required></div>
                <div class="row">
                    <div class="col-6 mb-2"><label class="form-label">Edad</label><input type="number" name="edad" min="14" max="90" class="form-control" required></div>
                    <div class="col-6 mb-2"><label class="form-label">Teléfono</label><input type="text" name="telefono" class="form-control" required></div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Tipo de Membresía</label>
                    <select name="tipoMembresia" class="form-select">
                        <option value="MENSUAL">MENSUAL ($70.000)</option>
                        <option value="TRIMESTRAL">TRIMESTRAL ($190.000)</option>
                        <option value="SEMESTRAL">SEMESTRAL ($360.000)</option>
                        <option value="ANUAL">ANUAL ($680.000)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-danger fw-bold">Guardar Cliente</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
