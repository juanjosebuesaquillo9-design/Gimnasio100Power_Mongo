<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Gimnasio 100% Power</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
<div class="card shadow-lg border-0" style="width: 430px; border-radius: 16px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger"><i class="bi bi-lightning-charge-fill"></i> 100% POWER</h2>
            <p class="text-muted mb-0">Sistema de Gestión Operativa y Transaccional</p>
        </div>
        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" name="correo" class="form-control" value="admin@100power.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" value="123456" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Ingresar al Sistema</button>
        </form>
        <hr>
        <div class="small text-muted">
            <strong>Accesos de prueba (Clave: 123456):</strong><br>
            • Admin: <code>admin@100power.com</code><br>
            • Recepción: <code>recepcion@100power.com</code><br>
            • Entrenador: <code>entrenador@100power.com</code><br>
            • Cliente: <code>cliente@100power.com</code>
        </div>
    </div>
</div>
</body>
</html>
